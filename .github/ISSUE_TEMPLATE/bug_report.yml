name: Bug report / 缺陷报告
description: Report a reproducible defect using synthetic or redacted data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        English or 简体中文 is welcome. Do not attach secrets, full configuration,
        subscriber identifiers or raw captures. Report vulnerabilities privately.
  - type: input
    id: revision
    attributes:
      label: Maintained revision
      description: Exact commit and the effective Go module Replace entry.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version, OS/architecture, kernel and relevant namespace/capability constraints.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer a synthetic test; do not paste complete device configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the command, sanitized error and any cleanup performed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety
      options:
        - label: I removed credentials, real subscriber data, key material and raw captures.
          required: true
        - label: I will use the private security channel for a vulnerability.
          required: true
